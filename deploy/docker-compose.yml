# llmux 本地 compose（路由器 /root/docker/llmux/docker-compose.yml 的受控子集）
#
# 只放 llmux 主服务的接线形状，真正的生产 compose 在路由器上，
# deploy.sh 只管 llmux 主服务。
#
# 生产 .env（路由器，不入仓）：ADMIN_USERNAME / ADMIN_PASSWORD / BASE_PATH。
#
# 注：2026-10-14 起 zen-free sidecar 已退役 —— 免费档的门是两个纯 HTTP 头
# （UA + ses_），llmux 原生直连 opencode.ai/zen/v1（category=zen），不再旁挂。
# 旧 sidecar 源码见 git 历史 deploy/zen-free/（已删除）。

services:
  llmux:
    build: .
    image: llmux:latest
    container_name: llmux
    restart: unless-stopped
    ports:
      - "25977:25976"
    environment:
      - DATA_DIR=/data/llmux
      - LOG_DIR=/data/llmux-logs
      - BASE_PATH=${BASE_PATH:-llmux}
      - TZ=Asia/Shanghai
      - RUST_LOG=llmux=info
      - LLMUX_BODY_DUMP=1
      - LOG_RETAIN_DAYS=${LOG_RETAIN_DAYS:-3}
      - BODY_RETAIN_DAYS=${BODY_RETAIN_DAYS:-1}
      - LOG_ROW_RETAIN_DAYS=${LOG_ROW_RETAIN_DAYS:-30}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - ./data:/data/llmux
      - /mnt/openwrt/log-archive/llmux:/data/llmux-logs
