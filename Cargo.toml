[workspace]
members = [
  "crates/llmux-core",
  "crates/llmux-server",
  "crates/llmux-bin",
]
resolver = "2"

[workspace.package]
version = "0.3.3"
edition = "2021"
license = "AGPL-3.0"
authors = ["Moody"]

[workspace.dependencies]
anyhow = "1"
aes-gcm = "0.10"
axum = "0.7"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
sha1 = "0.10"
http = "1"
mime_guess = "2"
sha2 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rust-embed = "8"
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
time = { version = "0.3", features = ["macros", "formatting", "local-offset", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "local-time"] }
tracing-appender = "0.2"
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = "0.28"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[profile.dev]
# 关掉调试信息。cargo 默认是 debug=2（全量），实测那 39% 的体积都是它 ——
# 集成测试可执行文件单个 160-207M，其中最大的那个 139M 是 .debug_str +
# .debug_info。14 个测试二进制 + 数百个 rlib 各带一份，加起来 1.4G。
#
# ⚠️ 代价：测试 panic 时只有函数名，没有「文件:行号」。需要调试时临时加：
#   CARGO_PROFILE_DEV_DEBUG=2 cargo test
# 那会让 cargo 全部重编（实测 3分24秒），所以别常开。
# ⚠️ 改这个值等价于全部重编，一次性 3分24秒，之后不再付。
debug = 0

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
