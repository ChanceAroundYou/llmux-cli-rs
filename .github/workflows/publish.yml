name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            name: windows-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build UI
        run: |
          cd ui
          bun install
          bun run build

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Rust binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          EXT=""
          if [[ "${{ matrix.name }}" == windows* ]]; then EXT=".exe"; fi
          cp target/${{ matrix.target }}/release/llmux$EXT ./llmux-${{ matrix.name }}$EXT
          # 生成 SHA256 校验文件（install.sh 下载后校验）
          python3 -c "import hashlib,sys; print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest(), ' ', sys.argv[1])" ./llmux-${{ matrix.name }}$EXT > ./llmux-${{ matrix.name }}$EXT.sha256

      - name: Upload to Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXT=""
          if [[ "${{ matrix.name }}" == windows* ]]; then EXT=".exe"; fi
          gh release upload ${{ github.event.release.tag_name }} llmux-${{ matrix.name }}$EXT llmux-${{ matrix.name }}$EXT.sha256 --clobber
