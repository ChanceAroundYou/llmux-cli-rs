name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            name: windows-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            name: macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build UI
        run: |
          cd ui
          bun install
          bun run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Rust binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          EXT=""
          if [[ "${{ matrix.name }}" == windows* ]]; then EXT=".exe"; fi
          cp target/${{ matrix.target }}/release/llmux$EXT ./llmux-${{ matrix.name }}$EXT

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXT=""
          if [[ "${{ matrix.name }}" == windows* ]]; then EXT=".exe"; fi
          gh release upload ${{ github.event.release.tag_name }} llmux-${{ matrix.name }}$EXT --clobber

